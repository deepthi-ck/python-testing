[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orderflow"
version = "1.0.0"
description = "Retail order fulfillment service used to validate Testable Python metrics, tools, and Confidence Score."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Orderflow" }]
keywords = ["fastapi", "orders", "retail", "testable", "metrics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.35.0",
    "sqlalchemy>=2.0.36,<2.1.0",
    "pydantic>=2.13.4,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "httpx>=0.27.2,<0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "coverage[toml]>=7.6.0,<8.0.0",
    "pylint>=3.2.0,<4.0.0",
    "flake8>=7.1.0,<8.0.0",
    "bandit>=1.7.10,<2.0.0",
    "radon>=6.0.1,<7.0.0",
    "pip-audit>=2.7.3,<3.0.0",
    "mutmut>=2.4.0,<3.0.0",
]

[project.scripts]
orderflow = "orderflow.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "unit: isolated unit tests",
    "integration: database and service integration",
    "functional: end-to-end API journeys",
]

[tool.coverage.run]
branch = true
source = ["orderflow"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.pylint.main]
ignore-paths = ["tests", "scripts", "quality"]
jobs = 1

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-instance-attributes",
    "too-many-locals",
    "duplicate-code",
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
max-complexity = 15

[tool.bandit]
exclude_dirs = ["tests", "quality", "scripts"]
skips = ["B101"]

[tool.mutmut]
paths_to_mutate = "src/orderflow/services/pricing_service.py"
backup = false
runner = "python -m pytest tests/unit/test_pricing_service.py -q"
