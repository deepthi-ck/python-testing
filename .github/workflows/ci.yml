name: CI

on:
  push:
  pull_request:

jobs:
  customer-versions:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          ["2.6", "2.7", "3.4", "3.5", "3.6", "3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.16"]
    steps:
      - uses: actions/checkout@v4
      - name: Customer version is registered
        run: python3 -c "import json; v='${{ matrix.python-version }}'; p=json.load(open('version.json',encoding='utf-8')); assert v in p['supportedCustomerVersions'], v; assert len(p['supportedCustomerVersions'])==15"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit, integration, and functional tests
        env:
          ORDERFLOW_ENVIRONMENT: test
          ORDERFLOW_DATABASE_URL: sqlite:///:memory:
          ORDERFLOW_API_KEY: test-key
        run: |
          python -m pytest tests --cov=orderflow --cov-branch --cov-report=term-missing --cov-report=xml
      - name: Lint
        run: |
          python -m flake8 src
      - name: Security and SCA
        run: |
          python -m bandit -r src/orderflow -c quality/config/bandit.yaml
          python -m pip_audit -r requirements.txt
      - name: Complexity
        run: |
          python -m radon cc src -s -n C
