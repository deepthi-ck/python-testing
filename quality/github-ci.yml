name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit, integration, and functional tests
        env:
          ORDERFLOW_ENVIRONMENT: test
          ORDERFLOW_DATABASE_URL: sqlite:///:memory:
          ORDERFLOW_API_KEY: test-key
        run: |
          python -m pytest tests --cov=orderflow --cov-branch --cov-report=term-missing --cov-report=xml
      - name: Lint
        run: |
          python -m flake8 src
      - name: Security and SCA
        run: |
          python -m bandit -r src/orderflow -c quality/config/bandit.yaml
          python -m pip_audit -r requirements.txt
      - name: Complexity
        run: |
          python -m radon cc src -s -n C
